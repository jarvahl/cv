name: Build & Deploy CV

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cv-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build CV
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: result

  deploy-pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: resume
          path: result

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: result

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: resume
          path: result

      - name: Upload PDF to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release upload "${GITHUB_REF_NAME}" result/resume.pdf --clobber \
              || gh release create "${GITHUB_REF_NAME}" result/resume.pdf --title "${GITHUB_REF_NAME}"
            exit 0
          fi

          git tag -f latest "${GITHUB_SHA}"
          git push --force origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest result/resume.pdf --clobber
          else
            gh release create latest result/resume.pdf --target "${GITHUB_SHA}" --title "Latest resume"
          fi
